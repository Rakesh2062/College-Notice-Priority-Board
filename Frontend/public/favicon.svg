<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a" />
      <stop offset="100%" stop-color="#1e3a60" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="100%" stop-color="#ee5253" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Board background -->
  <rect x="6" y="8" width="52" height="50" rx="10" fill="url(#boardGrad)" filter="url(#shadow)" />
  
  <!-- Subtle border highlight -->
  <rect x="7" y="9" width="50" height="48" rx="9" fill="none" stroke="#385785" stroke-width="1.5" />

  <!-- Sheet of notice paper -->
  <rect x="14" y="18" width="36" height="34" rx="4" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Content lines on sheet -->
  <rect x="19" y="27" width="22" height="3" rx="1.5" fill="#0b1f3a" />
  <rect x="19" y="34" width="26" height="2.5" rx="1.25" fill="#94a3b8" />
  <rect x="19" y="40" width="18" height="2.5" rx="1.25" fill="#cbd5e1" />

  <!-- Red Push Pin / Tack -->
  <!-- Pin head top -->
  <ellipse cx="32" cy="12" rx="6" ry="3.5" fill="url(#pinGrad)" />
  <!-- Pin cone body -->
  <path d="M28 12 L30 18 L34 18 L36 12 Z" fill="#d63031" />
  <!-- Pin highlight -->
  <ellipse cx="32" cy="11.5" rx="3.5" ry="1.5" fill="#ff7675" />
  <!-- Pin point -->
  <polygon points="31,18 33,18 32,23" fill="#636e72" />
</svg>
